# Load Balancer Controller turns this into an internet-facing ALB in the public subnets
# (discovered by the kubernetes.io/role/elb tag); target-type ip sends traffic straight to pod IPs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: web
  annotations:
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
spec:
  ingressClassName: alb
  rules:
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: web
                port:
                  number: 80
